[package]
name = "echomem-overlay"
version = "0.1.0"
description = "Transparent always-on-top overlay for EchoMem"
authors = ["EchoMem Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
